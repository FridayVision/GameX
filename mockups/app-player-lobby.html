<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameX – Player Lobby</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: { extend: {
                fontFamily: { sans:['"Space Grotesk"','sans-serif'] },
                colors: { page:'#080808', textMain:'#fafffe', primary:'#ec5838', accent:'#15F4C7' }
            }}
        }
    </script>
    <style>
        body { background:#080808; color:#fafffe; overflow:hidden; -webkit-font-smoothing:antialiased; overscroll-behavior:none; }

        .led-orange { position:absolute;inset:-5%; background-image:radial-gradient(circle,#ec5838 2px,transparent 2.1px); background-size:24px 24px; opacity:.85; -webkit-mask-image:radial-gradient(ellipse 160% 140% at 100% 100%,black 15%,black 40%,transparent 72%); mask-image:radial-gradient(ellipse 160% 140% at 100% 100%,black 15%,black 40%,transparent 72%); }
        .led-teal   { position:absolute;inset:-5%; background-image:radial-gradient(circle,#15F4C7 2px,transparent 2.1px); background-size:24px 24px; opacity:.85; -webkit-mask-image:radial-gradient(ellipse 160% 140% at 0% 0%,black 15%,black 40%,transparent 72%); mask-image:radial-gradient(ellipse 160% 140% at 0% 0%,black 15%,black 40%,transparent 72%); }

        /* Player identity circle */
        .id-circle {
            width: 68px; height: 68px;
            border-radius: 50%; border: 3px solid #15F4C7;
            background: rgba(21,244,199,.13);
            color: #15F4C7;
            display: flex; align-items: center; justify-content: center;
            font-size: 2rem; font-weight: 900;
            animation: glow-pulse 2.8s ease-in-out infinite;
            flex-shrink: 0;
        }
        @keyframes glow-pulse {
            0%,100% { box-shadow: 0 0 0 0 rgba(21,244,199,0), 0 0 16px rgba(21,244,199,.20); }
            50%      { box-shadow: 0 0 0 10px rgba(21,244,199,.07), 0 0 28px rgba(21,244,199,.32); }
        }

        /* Player rows in list */
        .p-row { display:flex; align-items:center; gap:11px; padding:10px 0; border-bottom:1px solid rgba(250,255,254,.05); }
        .p-row:last-child { border-bottom:none; }
        .p-dot { width:36px; height:36px; border-radius:50%; border:2px solid; display:flex; align-items:center; justify-content:center; font-size:.88rem; font-weight:900; flex-shrink:0; }
        .p-name { font-size:.88rem; font-weight:600; color:rgba(250,255,254,.85); }
        .p-badges { display:flex; gap:4px; margin-top:2px; }
        .b-you  { font-size:.48rem; font-weight:800; letter-spacing:.08em; text-transform:uppercase; padding:2px 5px; border-radius:3px; background:rgba(250,255,254,.08); border:1px solid rgba(250,255,254,.14); color:rgba(250,255,254,.48); }
        .b-host { font-size:.48rem; font-weight:800; letter-spacing:.08em; text-transform:uppercase; padding:2px 5px; border-radius:3px; background:rgba(236,88,56,.13); border:1px solid rgba(236,88,56,.28); color:#ec5838; }

        /* Scroll */
        .inner-scroll { overflow-y:auto; -webkit-overflow-scrolling:touch; scrollbar-width:thin; scrollbar-color:rgba(250,255,254,.09) transparent; }
        .inner-scroll::-webkit-scrollbar { width:3px; }
        .inner-scroll::-webkit-scrollbar-thumb { background:rgba(250,255,254,.10); border-radius:2px; }

        /* Waiting dots */
        .wdot { width:5px; height:5px; border-radius:50%; display:inline-block; animation:wd 1.6s ease-in-out infinite; }
        .wdot:nth-child(2) { animation-delay:.28s; }
        .wdot:nth-child(3) { animation-delay:.56s; }
        @keyframes wd { 0%,100%{opacity:.18} 50%{opacity:.9} }

        /* About-to-start state */
        .starting-pulse { animation:sp 1.2s ease-in-out infinite; }
        @keyframes sp { 0%,100%{opacity:.55} 50%{opacity:1} }

        .dev-toggle { position:fixed; bottom:16px; right:16px; z-index:999; background:rgba(21,244,199,.12); border:1px solid rgba(21,244,199,.38); color:#15F4C7; font-family:'Space Grotesk',sans-serif; font-size:.65rem; font-weight:700; letter-spacing:.1em; padding:6px 13px; border-radius:20px; cursor:pointer; }
    </style>
</head>

<body class="h-[100dvh]">

    <!-- Background -->
    <div class="fixed inset-0 z-0 pointer-events-none overflow-hidden">
        <div class="led-orange"></div>
        <div class="led-teal"></div>
        <div class="absolute inset-0" style="background:radial-gradient(ellipse at center,transparent 30%,#080808 95%)"></div>
    </div>

    <div class="relative z-10 h-[100dvh] flex flex-col px-4 pt-6 pb-4 overflow-hidden">

        <!-- Identity card (this player = Padma, teal) -->
        <div class="w-full max-w-[390px] mx-auto shrink-0 mb-3">
            <div class="rounded-[16px] px-5 py-4 flex items-center gap-4"
                 style="background:#0e0e0e; border:1px solid rgba(250,255,254,.18);
                        box-shadow:0 0 0 1px rgba(0,0,0,.8),0 8px 32px rgba(0,0,0,.60)">
                <div class="id-circle">P</div>
                <div>
                    <p class="text-textMain/38 text-[.55rem] uppercase tracking-[.26em] font-bold mb-0.5">You're in</p>
                    <h1 class="text-textMain text-[1.75rem] font-black leading-none tracking-[-0.03em]">Padma</h1>
                    <p class="text-textMain/35 text-[.70rem] font-medium mt-1">Room <span style="color:#ec5838;font-weight:700">7349</span></p>
                </div>
            </div>
        </div>

        <!-- Main card -->
        <div class="w-full max-w-[390px] mx-auto flex-1 flex flex-col rounded-[20px] overflow-hidden min-h-0"
             style="background:#0e0e0e; border:1px solid rgba(250,255,254,.18);
                    box-shadow:0 0 0 1px rgba(0,0,0,.8),0 16px 56px rgba(0,0,0,.70)">

            <!-- Topic info -->
            <div class="shrink-0 px-6 pt-6 pb-5 border-b border-textMain/[.07]">
                <p class="text-textMain/40 text-[.56rem] uppercase tracking-[.26em] font-bold mb-1.5">Topic</p>
                <p class="text-textMain/80 font-bold text-[1rem] mb-2">Bollywood Movies</p>
                <div class="flex items-center gap-1.5">
                    <span class="text-textMain/30 text-[.65rem]">16 items</span>
                    <span class="text-textMain/18 text-[.60rem]">·</span>
                    <span class="text-textMain/30 text-[.65rem]">4 rounds</span>
                    <span class="text-textMain/18 text-[.60rem]">·</span>
                    <span class="text-textMain/30 text-[.65rem]">Host: Raahul</span>
                </div>
            </div>

            <!-- Player list -->
            <div class="flex-1 inner-scroll px-6 py-4 min-h-0">
                <div class="flex items-center justify-between mb-3">
                    <span class="text-textMain/45 text-[.56rem] uppercase tracking-[.26em] font-bold">In The Room</span>
                    <span id="count-label" class="text-[.78rem] font-bold" style="color:#15F4C7">2 / 8</span>
                </div>
                <div id="player-list"></div>
            </div>

            <!-- Waiting footer -->
            <div class="shrink-0 border-t border-textMain/[.07] px-6 pt-4 pb-5">
                <div id="waiting-state">
                    <div class="flex items-center justify-center gap-2 mb-1">
                        <span class="wdot" style="background:#15F4C7"></span>
                        <span class="wdot" style="background:#15F4C7"></span>
                        <span class="wdot" style="background:#15F4C7"></span>
                    </div>
                    <p class="text-textMain/38 text-[.72rem] text-center font-medium">
                        Waiting for <span id="host-name" class="text-primary font-bold">Raahul</span> to start the game…
                    </p>
                </div>
                <div id="starting-state" class="hidden text-center">
                    <p class="starting-pulse text-[.72rem] font-bold mb-0.5" style="color:#15F4C7">Get ready!</p>
                    <p class="text-textMain/55 text-[.70rem]">Raahul is about to start the game</p>
                </div>
            </div>

        </div>
    </div>

    <button class="dev-toggle" onclick="toggleState()">TOGGLE STATE</button>

    <script>
        // This screen is from Padma's perspective
        const THIS_PLAYER = { n:'Padma',  c:'#15F4C7', you:true,  host:false };

        const ALL_PLAYERS = [
            { n:'Raahul', c:'#ec5838', you:false, host:true  },
            { n:'Padma',  c:'#15F4C7', you:true,  host:false },
            { n:'Sri',    c:'#9b5de5', you:false, host:false },
        ];

        // State 0 = 2 players (waiting), State 1 = 3 players (Raahul about to start)
        const STATES = [
            { count:2, starting:false },
            { count:3, starting:true  },
        ];
        let si = 0;

        function rgba(hex, a) {
            const [r,g,b] = [1,3,5].map(i => parseInt(hex.slice(i,i+2),16));
            return `rgba(${r},${g},${b},${a})`;
        }

        function render(state) {
            const players = ALL_PLAYERS.slice(0, state.count);
            const list = document.getElementById('player-list');
            list.innerHTML = '';
            players.forEach(p => {
                const row = document.createElement('div');
                row.className = 'p-row';
                row.innerHTML = `
                    <div class="p-dot" style="border-color:${p.c};background:${rgba(p.c,.13)};color:${p.c}">${p.n[0]}</div>
                    <div>
                        <div class="p-name">${p.n}</div>
                        <div class="p-badges">
                            ${p.you  ? '<span class="b-you">You</span>'   : ''}
                            ${p.host ? '<span class="b-host">Host</span>' : ''}
                        </div>
                    </div>`;
                list.appendChild(row);
            });

            document.getElementById('count-label').textContent = `${state.count} / 8`;

            const waiting  = document.getElementById('waiting-state');
            const starting = document.getElementById('starting-state');
            if (state.starting) {
                waiting.classList.add('hidden');
                starting.classList.remove('hidden');
            } else {
                waiting.classList.remove('hidden');
                starting.classList.add('hidden');
            }
        }

        function toggleState() {
            si = (si + 1) % STATES.length;
            render(STATES[si]);
        }

        render(STATES[0]);
    </script>
</body>
</html>
